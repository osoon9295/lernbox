name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    # ① 임시 PostgreSQL 띄우기 (테스트 끝나면 같이 사라짐)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lernbox_test
        ports:
          - 5432:5432
        # DB가 준비될 때까지 기다리는 health check
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # ② 모든 step이 공유할 환경변수
    env:
      # 임시 PostgreSQL을 가리킴 (DATABASE_URL과 DIRECT_URL 둘 다 동일하게)
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lernbox_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/lernbox_test
      # JWT 비밀키 (GitHub Secrets에서)
      JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      # 테스트 계정 (GitHub Secrets에서)
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci

      # ③ Prisma Client 생성 + 마이그레이션 (집 짓기)
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Run migrations
        run: npx prisma migrate deploy

      # ④ 테스트 계정 심기 (시드)
      - name: Seed test account
        run: npx prisma db seed

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # ⑤ E2E 실행
      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
